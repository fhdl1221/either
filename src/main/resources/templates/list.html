<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Either - 밸런스 게임</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card:hover { transform: translateY(-5px); transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .vs-badge { background-color: #ff6b6b; color: white; padding: 5px 10px; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/questions">⚖️ Either Game</a>
        <div class="d-flex">
            <a href="/questions/new" class="btn btn-primary fw-bold">+ 새 질문 만들기</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="text-center mb-4 fw-bold">🔥 진행 중인 투표</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="question : ${questions}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="card-title text-muted mb-3" th:text="${question.title}">질문 제목</h5>
                    <div class="d-flex justify-content-center align-items-center mb-3">
                        <span class="fs-4 fw-bold text-primary" th:text="${question.optionA}">A</span>
                        <span class="mx-3 vs-badge">VS</span>
                        <span class="fs-4 fw-bold text-info" th:text="${question.optionB}">B</span>
                    </div>
                    <a th:href="@{/questions/{id}(id=${question.id})}" class="btn btn-outline-dark w-100 mt-auto">투표하러 가기</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
