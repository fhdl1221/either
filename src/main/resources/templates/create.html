<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 질문 만들기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 500px;">
        <div class="card-body p-5">
            <h2 class="text-center fw-bold mb-4">✨ 새 밸런스 게임</h2>

            <form th:action="@{/questions}" th:object="${question}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">질문 주제</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="예: 평생 한 가지 음식만 먹는다면?" required>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label for="optionA" class="form-label fw-bold text-danger">선택지 A</label>
                        <input type="text" id="optionA" th:field="*{optionA}" class="form-control" placeholder="예: 짜장면" required>
                    </div>
                    <div class="col-6">
                        <label for="optionB" class="form-label fw-bold text-info">선택지 B</label>
                        <input type="text" id="optionB" th:field="*{optionB}" class="form-control" placeholder="예: 짬뽕" required>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">질문 등록하기</button>
                    <a href="/questions" class="btn btn-outline-secondary">취소하고 목록으로</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
